[alembic]
# Path to migration scripts directory
script_location = migrations

# File naming template for auto-generated revision files
file_template = %%(rev)s_%%(slug)s

# Timezone for timestamps in migration files
timezone = UTC

# Maximum length of auto-generated revision file names
truncate_slug_length = 40

# Revision IDs use a randomized GUID by default; set to true for sequential integers
revision_environment = false

# Omit source_format column type
sourceless = false

# Version path separator
version_path_separator = os

# Output encoding
output_encoding = utf-8

# Database URL is set programmatically in migrations/env.py from DATABASE_URL env var.
# Do NOT hardcode credentials here.
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
