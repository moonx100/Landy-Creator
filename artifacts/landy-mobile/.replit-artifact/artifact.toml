kind = "mobile"
previewPath = "/landy-mobile/"
title = "LANDY Mobile"
version = "1.0.0"
id = "artifacts/landy-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/landy-mobile/" ]
localPort = 19758

[services.development]
run = "pnpm --filter @workspace/landy-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/landy-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/landy-mobile", "run", "serve" ]

[services.env]
PORT = "19758"
BASE_PATH = "/landy-mobile/"
